name: Build and publish image

on:
  push:
    branches: [main]
    paths-ignore: ['eggs/**', '**.md']
  schedule:
    # Weekly rebuild (Mon 03:00 UTC) to pull new Node 26 patches + Debian security updates
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true      # always fetch the freshest base image
          no-cache: true  # never reuse stale apt layers
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:26
